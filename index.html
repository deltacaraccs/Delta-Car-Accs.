<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>مدير المخزون والمبيعات | دلتا</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دلتا">
<meta name="theme-color" content="#14171B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --panel: rgba(28,33,38,0.62);
    --panel-alt: rgba(36,42,49,0.55);
    --border: rgba(255,255,255,0.09);
    --amber:#F2A93B; --amber-dim:#8A6A2E;
    --red:#E6483D; --green:#4CAF7D;
    --text:#F1EEE7; --muted:#8B92A0;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  body.theme-light{
    --panel: rgba(255,255,255,0.86);
    --panel-alt: rgba(230,229,226,0.8);
    --border: rgba(0,0,0,0.10);
    --text:#000000; --muted:#4A4A4A;
    background:#F2F2F0 !important;
  }
  body.theme-light .glass{ background:var(--panel) !important; }
  body.theme-light .tab.active{ color:#fff; }
  body.theme-light .btn-amber,
  body.theme-light .btn-green,
  body.theme-light .btn-red{ color:#fff; }
  .themebtn{width:36px;height:36px;border:none;border-radius:12px;background:var(--panel-alt);
    color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .15s var(--ease);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;}
  body{
    padding-bottom:70px;
    background:
      radial-gradient(circle at 15% -8%, rgba(242,169,59,0.16) 0%, rgba(242,169,59,0) 45%),
      radial-gradient(circle at 90% 15%, rgba(76,175,125,0.10) 0%, rgba(76,175,125,0) 40%),
      radial-gradient(circle at 50% 110%, rgba(230,72,61,0.08) 0%, rgba(230,72,61,0) 45%),
      #14171B;
    background-attachment:fixed;
    min-height:100vh;
  }
  .mono{font-family:'Courier New',monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:640px;margin:0 auto;padding:14px;}
  .glass{
    background:var(--panel);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
    border:1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .25s var(--ease);
  }
  button, .btn, .tab, .catcard, .iconbtn, .themebtn, .stepper button{
    transition: transform .12s var(--ease), opacity .12s var(--ease), background .18s var(--ease);
  }
  button:active, .btn:active, .tab:active, .iconbtn:active, .themebtn:active, .stepper button:active{
    transform: scale(0.94);
  }
  .card.glass:active, .stat.clickable:active{ transform: scale(0.985); }
  /* tab content fade+slide transition */
  #tab-inventory, #tab-sales, #tab-purchases, #tab-invoices{
    animation: tabIn .28s var(--ease);
  }
  @keyframes tabIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
  /* modal enter animation */
  .overlay{ animation: overlayIn .2s var(--ease); }
  @keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal{ animation: modalIn .28s var(--ease); }
  @keyframes modalIn{
    from{ opacity:0; transform: translateY(24px) scale(0.97); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 16px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    border-radius:16px;position:relative;overflow:hidden;}
  .logo img{width:100%;height:100%;object-fit:cover;}
  .logo .emoji-fallback{font-size:26px;}
  .logo .edit{position:absolute;bottom:2px;left:2px;width:20px;height:20px;border:none;
    border-radius:7px;color:var(--muted);font-size:10px;display:flex;align-items:center;justify-content:center;
    background:var(--panel-alt);}
  .brand h1{font-size:15.5px;margin:0;font-weight:900;line-height:1.25;}
  .brand p{font-size:11px;margin:0;color:var(--muted);}
  .stats{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .stat{flex:1;min-width:118px;border-radius:18px;padding:12px;text-align:right;}
  .stat.clickable{cursor:pointer;}
  .stat .lbl{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px;}
  .stat .val{font-size:18px;font-weight:800;}
  .stat .sub{font-size:10px;color:var(--muted);margin-top:2px;}
  .tabs{display:flex;gap:4px;border-radius:18px;padding:4px;width:fit-content;margin-bottom:14px;}
  .tab{border:none;background:transparent;color:var(--muted);font-weight:800;font-size:13.5px;
    padding:9px 14px;border-radius:14px;display:flex;align-items:center;gap:6px;}
  .tab.active{background:var(--amber);color:#fff;}
  .row{display:flex;gap:8px;margin-bottom:14px;}
  .search{flex:1;position:relative;}
  .search input{width:100%;border-radius:14px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;border:1px solid var(--border);background:var(--panel-alt);}
  .btn{border:none;border-radius:14px;font-weight:800;font-size:13.5px;padding:11px 16px;
    display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-ghost{background:var(--panel-alt);color:var(--text);border:1px dashed var(--border);}
  .btn-red-ghost{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn:disabled{background:var(--panel-alt);color:var(--muted);opacity:.5;}
  .card{border-radius:20px;padding:12px;margin-bottom:8px;}
  .prow{display:flex;align-items:center;gap:10px;}
  .prow .gauge{flex-shrink:0;}
  .prow .info{flex:1;min-width:0;}
  .prow .info .name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .codebadge{font-family:'Courier New',monospace;font-size:10.5px;background:var(--panel-alt);
    color:var(--amber-dim);padding:2px 6px;border-radius:6px;border:1px solid var(--border);}
  .prow .info .meta{font-size:10.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;}
  .brandlogo{width:20px;height:20px;border-radius:5px;object-fit:cover;flex-shrink:0;}
  .stepper{display:flex;align-items:center;gap:4px;}
  .stepper button{width:26px;height:26px;border:none;border-radius:9px;background:var(--panel-alt);
    color:var(--text);font-weight:800;font-size:14px;}
  .stepper span{width:20px;text-align:center;font-size:13px;}
  .pillbtns{display:flex;gap:5px;align-items:center;}
  .iconbtn{width:28px;height:28px;border:none;background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .actionrow{display:flex;gap:6px;margin-top:9px;align-items:center;}
  .empty{text-align:center;padding:50px 10px;color:var(--muted);font-size:13.5px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead tr{background:var(--panel-alt);color:var(--muted);}
  th,td{padding:10px 8px;text-align:right;white-space:nowrap;}
  tbody tr{border-top:1px solid var(--border);}
  tbody tr.returned{opacity:.45;}
  .tablewrap{border:1px solid var(--border);border-radius:18px;overflow:hidden;overflow-x:auto;}
  .profit{color:var(--green);font-weight:800;}
  .tagreturned{font-size:10px;background:var(--red);color:#fff;padding:2px 6px;border-radius:6px;margin-inline-start:5px;}
  .btn-mini{border:none;border-radius:9px;background:var(--panel-alt);color:var(--text);
    font-size:11px;font-weight:800;padding:6px 9px;}
  .receipt-item{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 0;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px solid var(--border);
    padding-top:8px;margin-top:6px;font-weight:800;color:var(--amber-dim);}
  .overlay{position:fixed;inset:0;background:rgba(20,15,10,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;}
  @media(min-width:520px){.overlay{align-items:center;}}
  .modal{width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:18px;max-height:86vh;overflow-y:auto;}
  @media(min-width:520px){.modal{border-radius:22px;}}
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:900;display:flex;justify-content:space-between;align-items:center;}
  .modal h3 button{background:none;border:none;color:var(--muted);font-size:18px;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;border-radius:12px;padding:10px 12px;color:var(--text);
    font-size:14px;outline:none;border:1px solid var(--border);background:var(--panel-alt);font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:12px 20px;
    border-radius:16px;font-weight:800;font-size:13.5px;z-index:60;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,0.15);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    backdrop-filter: blur(18px) saturate(180%);
    max-width:88vw;text-align:center;
    animation: toastIn .32s var(--ease);}
  @keyframes toastIn{
    from{ opacity:0; transform: translateX(-50%) translateY(-14px); }
    to{ opacity:1; transform: translateX(-50%) translateY(0); }
  }
  .toast.ok{background:rgba(76,175,125,0.92);color:#fff;}
  .toast.err{background:rgba(230,72,61,0.92);color:#fff;}
  .modetabs{display:flex;gap:5px;margin-bottom:8px;}
  .modetab{font-size:10.5px;padding:6px 10px;border-radius:10px;border:none;font-weight:800;color:var(--muted);background:transparent;}
  .modetab.active{background:var(--amber);color:#fff;}
  .purchase-item{border-radius:14px;padding:10px;margin-bottom:9px;}
  .purchase-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}

  /* categories: equal square tiles, image fills tile, caption below */
  .catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;}
  @media(max-width:360px){.catgrid{grid-template-columns:repeat(2,1fr);}}
  .catcard{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;}
  .catcard .icon{width:100%;aspect-ratio:1/1;border-radius:20px;
    display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;position:relative;}
  .catcard .icon img{width:100%;height:100%;object-fit:cover;}
  .catcard .name{font-size:11.5px;font-weight:800;text-align:center;line-height:1.25;width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .catcard .count{font-size:9.5px;color:var(--muted);}
  .catcard .lowdot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;
    background:var(--red);border:2px solid #fff;z-index:2;}
  .catcard .edit{position:absolute;top:5px;left:5px;width:24px;height:24px;border:none;
    border-radius:8px;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;z-index:2;
    background:var(--panel-alt);}
  .catcard.addnew .icon{border:1.5px dashed var(--border);background:transparent!important;
    -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;color:var(--muted);}
  .backbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .backbar button{border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:8px 12px;font-size:13px;font-weight:800;}
  .backbar .catname{font-weight:900;font-size:15px;}
  .sectionlabel{font-size:11px;color:var(--muted);margin:14px 0 8px;font-weight:700;}
  .iconpicker{display:flex;align-items:center;gap:10px;}
  .iconpreview{width:52px;height:52px;border-radius:16px;background:var(--panel-alt);
    display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0;
    border:1px solid var(--border);}
  .iconpreview img{width:100%;height:100%;object-fit:cover;}
  .filebtn{background:var(--panel-alt);border:1px solid var(--border);border-radius:12px;
    padding:8px 12px;font-size:12px;color:var(--text);display:inline-block;cursor:pointer;}
  .footerbar{max-width:640px;margin:20px auto 0;padding:0 14px;display:flex;gap:8px;justify-content:center;}

  /* invoices */
  .cartrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .cartrow .nm{flex:1;font-size:13px;font-weight:700;}
  .cartrow .qtybox{display:flex;align-items:center;gap:4px;}
  .cartrow .qtybox button{width:24px;height:24px;border:none;border-radius:8px;background:var(--panel-alt);color:var(--text);font-weight:800;}
  .cartrow .price{width:70px;text-align:left;font-size:12px;color:var(--muted);}
  .invoice-total{display:flex;justify-content:space-between;padding:12px 0;font-weight:900;font-size:16px;border-top:2px solid var(--border);margin-top:6px;}
  .analytics-section{margin-bottom:16px;}
  .analytics-section h4{font-size:12.5px;margin:0 0 8px;color:var(--muted);font-weight:800;}
  .analytics-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .analytics-row .n{font-weight:700;}
  .periodtabs{display:flex;gap:5px;margin-bottom:10px;}
  .periodtab{font-size:11.5px;padding:6px 12px;border-radius:10px;border:none;font-weight:800;color:var(--muted);background:var(--panel-alt);}
  .periodtab.active{background:var(--amber);color:#fff;}

  /* print */
  #printArea{display:none;}
  @media print{
    @page{ size:A4; margin:14mm; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block; position:absolute; top:0; left:0; width:100%; background:#fff; color:#000; }
    .invoice-paper{ font-family:-apple-system,Arial,sans-serif; color:#000; direction:rtl; width:100%; }
    .invoice-paper .inv-logo-wrap{ text-align:center; margin-bottom:6px; }
    .invoice-paper .inv-logo-wrap img{ height:70px; object-fit:contain; }
    .invoice-paper .inv-tagline{ text-align:center; font-size:13px; font-weight:800; margin-bottom:18px; }
    .invoice-paper .inv-metarow{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:16px; }
    .invoice-paper .inv-metarow > div{ line-height:1.9; }
    .invoice-paper table{ width:100%; border-collapse:collapse; }
    .invoice-paper thead th{ background:#E2860F; color:#fff; font-size:12.5px; padding:8px 6px; text-align:center; }
    .invoice-paper tbody td{ border-bottom:1px solid #ddd; padding:7px 6px; font-size:12.5px; text-align:center; }
    .invoice-paper tbody td:nth-child(2){ text-align:right; }
    .invoice-paper .inv-total-row{ display:flex; background:#E2860F; color:#fff; font-weight:800;
      font-size:13.5px; padding:8px 10px; justify-content:space-between; margin-top:2px; }
    .invoice-paper .inv-paid-row{ display:flex; justify-content:space-between; padding:8px 10px; font-size:13px; font-weight:700; }
    .invoice-paper .inv-paid-row .lbl-paid{ color:#1F9D63; }
    .invoice-paper .inv-paid-row .lbl-due{ color:#E24438; }
    .invoice-paper .inv-paid-row .blank{ display:inline-block; min-width:110px; border-bottom:1px solid #999; }
    .invoice-paper .inv-notes{ margin-top:26px; font-size:12.5px; }
    .invoice-paper .inv-notes ul{ margin:8px 0 0; padding-inline-start:18px; }
    .invoice-paper .inv-notes li{ margin-bottom:14px; border-bottom:1px dotted #ccc; }
    .invoice-paper .inv-approve{ margin-top:26px; font-size:13px; }
    .invoice-paper .inv-thanks{ text-align:center; font-size:20px; font-weight:800; margin-top:40px; }
    .invoice-paper .inv-footer{ text-align:center; margin-top:34px; font-size:12px; font-weight:700; }
    .invoice-paper .inv-footer div{ margin-top:4px; }
  }
  .footerbtn{border:1px solid var(--border);color:var(--muted);
    border-radius:12px;padding:9px 12px;font-size:11.5px;font-weight:700;flex:1;text-align:center;}

  /* ===================== RESPONSIVE (tablet / laptop / desktop) =====================
     Mobile stays exactly as-is (single column, touch-friendly, horizontal-scroll stats).
     From 780px the layout widens progressively into a dashboard-style grid so it fills
     laptop/desktop screens instead of rendering as a stretched phone view. */

  @media (min-width:780px){
    .wrap{max-width:920px;padding:22px 26px;}
    .footerbar{max-width:920px;}
    .header{padding:4px 0 20px;}
    .brand h1{font-size:18px;}
    .brand p{font-size:12px;}
    .logo{width:58px;height:58px;}

    /* stats become a real grid instead of a horizontal-scroll strip */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      overflow-x:visible;gap:10px;margin-bottom:18px;}
    .stat{min-width:0;padding:14px 16px;}
    .stat .val{font-size:20px;}

    .tabs{width:100%;box-sizing:border-box;}
    .tab{flex:1;justify-content:center;padding:11px 16px;font-size:14px;}

    .row{margin-bottom:18px;}
    .search input{padding:12px 14px;font-size:14.5px;}
    .btn{padding:12px 18px;font-size:14px;}

    /* category tiles: more columns, a bit larger, on wider screens */
    .catgrid{grid-template-columns:repeat(5,1fr);gap:16px 14px;}

    .card{padding:14px 16px;}

    /* comfortable tables: no cramped horizontal scroll on wide screens */
    .tablewrap{overflow-x:visible;}
    table{font-size:13.5px;}
    th,td{padding:12px 10px;}

    /* modals grow with the screen instead of staying phone-sized */
    .modal{max-width:640px;border-radius:22px;padding:26px;}
    .overlay{align-items:center;}

    .cartrow .nm{font-size:14px;}
    .purchase-item{padding:14px 16px;}
  }

  @media (min-width:1180px){
    .wrap{max-width:1200px;padding:28px 34px;}
    .footerbar{max-width:1200px;}
    .stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
    .catgrid{grid-template-columns:repeat(7,1fr);}
    .modal{max-width:760px;}
  }

  @media (min-width:780px) and (pointer:fine){
    .btn:hover,.tab:hover,.stat.clickable:hover,.catcard:hover .icon{
      filter:brightness(1.08);
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header" id="headerRoot"></div>

  <div class="stats" id="stats"></div>

  <div class="tabs glass">
    <button class="tab active" data-tab="inventory" onclick="switchTab('inventory')">📦 المخزون</button>
    <button class="tab" data-tab="sales" onclick="switchTab('sales')">🛒 المبيعات</button>
    <button class="tab" data-tab="purchases" onclick="switchTab('purchases')">🚚 الشراء</button>
    <button class="tab" data-tab="invoices" onclick="switchTab('invoices')">🧾 وصل بيع</button>
  </div>

  <div id="tab-inventory">
    <div class="row">
      <div class="search"><input id="searchInput" placeholder="بحث بالاسم أو الرمز أو الموديل..." oninput="renderInventory()"></div>
      <button class="btn btn-ghost" onclick="openCategoryModal(null,null)">＋ صندوق</button>
    </div>
    <div id="inventoryRoot"></div>
  </div>

  <div id="tab-sales" style="display:none;"></div>
  <div id="tab-purchases" style="display:none;">
    <button class="btn btn-amber" style="margin-bottom:14px;" onclick="openPurchaseModal()">＋ وصل شراء جديد</button>
    <div id="purchaseList"></div>
  </div>
  <div id="tab-invoices" style="display:none;">
    <div class="row">
      <div class="search"><input id="invoiceSearchInput" placeholder="بحث باسم الزبون أو رقم الوصل أو الهاتف..." oninput="renderInvoices()"></div>
    </div>
    <button class="btn btn-amber" style="margin-bottom:14px;" onclick="openInvoiceModal()">＋ وصل بيع جديد</button>
    <div id="invoiceList"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="printArea"></div>

<script>

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.categories) parsed.categories = [];
      if(!parsed.invoices) parsed.invoices = [];
      if(!parsed.settlements) parsed.settlements = [];
      if(!parsed.settings) parsed.settings = { name:'مدير المخزون والمبيعات', subtitle:'دلتا — يعمل بدون إنترنت', logo:DEFAULT_LOGO };
      if(parsed.settings.theme===undefined) parsed.settings.theme = 'dark';
      if(!parsed.settings.address) parsed.settings.address = 'بغداد/ حسينية الراشدية / مدخل الجسر';
      if(!parsed.settings.phones) parsed.settings.phones = '07712898510 / 07712216238';
      if(!parsed.settings.logo) parsed.settings.logo = DEFAULT_LOGO;
      return parsed;
    }
  }catch(e){}
  return { products: [], sales: [], purchases: [], categories: [], invoices: [], settlements: [], settings:{ name:'مدير المخزون والمبيعات', subtitle:'دلتا — يعمل بدون إنترنت', logo:DEFAULT_LOGO, theme:'dark', address:'بغداد/ حسينية الراشدية / مدخل الجسر', phones:'07712898510 / 07712216238' } };
}

function isLow(p){ return p.qty <= (p.minStock ?? 3); }

/* apply glass class to dynamically created panel-ish elements via CSS already; helper for markup */
function collectDescendantCategoryIds(id){
  let ids=[id];
  db.categories.filter(c=>c.parentId===id).forEach(ch=> ids.push(...collectDescendantCategoryIds(ch.id)));
  return ids;
}
function categoryHasLowStockDeep(id){
  const ids = collectDescendantCategoryIds(id);
  return db.products.some(p=> p.categoryId && ids.includes(p.categoryId) && isLow(p));
}

/* ---------- tabs ---------- */
function switchTab(name){
  ['inventory','sales','purchases','invoices'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = (t===name)?'block':'none';
    document.querySelector(`.tab[data-tab="${t}"]`).classList.toggle('active', t===name);
  });
  if(name==='sales') renderSales();
  if(name==='purchases') renderPurchases();
  if(name==='inventory') renderInventory();
  if(name==='invoices') renderInvoices();
}

/* ---------- profit / debts engine ----------
   Every invoice can be paid in full, partly, or not at all (باقي/دين).
   Only the *paid* portion of an invoice's margin counts as realized profit
   right now; the rest sits as "profitDue" until the debt is settled via
   settleDebt(), at which point it is added to today's + total profit. */
function computeInvoiceProfitBreakdown(inv){
  const activeSales = (inv.saleIds||[]).map(id=>db.sales.find(s=>s.id===id)).filter(s=>s && !s.returned);
  const profitTotal = activeSales.reduce((s,x)=>s+x.profit,0);
  const total = inv.total || 0;
  const due = inv.due ?? 0;
  const paid = inv.paid ?? (total-due);
  const ratio = total>0 ? Math.max(0, Math.min(1, paid/total)) : 1;
  return { profitTotal, profitPaid: profitTotal*ratio, profitDue: profitTotal*(1-ratio) };
}
function computeProfitStats(){
  const today = new Date().toDateString();
  let todayProfit = 0, totalProfit = 0;
  const invoiceSaleIds = new Set();
  db.invoices.forEach(inv=>(inv.saleIds||[]).forEach(id=>invoiceSaleIds.add(id)));
  // quick sales (from المخزون tab, not tied to an invoice) always count in full
  db.sales.filter(s=>!s.returned && !invoiceSaleIds.has(s.id)).forEach(s=>{
    totalProfit += s.profit;
    if(new Date(s.date).toDateString()===today) todayProfit += s.profit;
  });
  // invoice sales: only the paid share counts
  db.invoices.forEach(inv=>{
    const { profitPaid } = computeInvoiceProfitBreakdown(inv);
    totalProfit += profitPaid;
    if(new Date(inv.date).toDateString()===today) todayProfit += profitPaid;
  });
  // debts settled today (for invoices not created today) bump today's profit too
  (db.settlements||[]).forEach(st=>{
    const inv = db.invoices.find(x=>x.id===st.invoiceId);
    const invToday = inv && new Date(inv.date).toDateString()===today;
    const stToday = new Date(st.date).toDateString()===today;
    if(stToday && !invToday) todayProfit += st.amount;
  });
  return { todayProfit, totalProfit };
}
function totalDebtAmount(){
  return db.invoices.reduce((s,inv)=> s + Math.max(0, inv.due||0), 0);
}
function totalSupplierDebtAmount(){
  return db.purchases.reduce((s,r)=> s + Math.max(0, r.due||0), 0);
}

  const p = db.products.find(x=>x.id===productId);

  const parts = [p.name];

/* ---------- analytics ---------- */
let analyticsPeriod = 'week';
function openAnalyticsModal(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="closeModal(event)">
      <div class="modal glass" onclick="event.stopPropagation()">
        <h3>التحليلات <button onclick="closeModal()">✕</button></h3>
        <div id="analyticsBody"></div>
      </div>
    </div>`;
  renderAnalyticsBody();
}
function setAnalyticsPeriod(p){ analyticsPeriod = p; renderAnalyticsBody(); }
function renderAnalyticsBody(){
  const validSales = db.sales.filter(s=>!s.returned);

  // best / worst sellers (by total qty sold across all time)
  const qtyByProduct = {};
  validSales.forEach(s=>{ qtyByProduct[s.productId] = (qtyByProduct[s.productId]||0) + s.qty; });
  const soldEntries = Object.entries(qtyByProduct).map(([pid,qty])=>{
    const p = db.products.find(x=>x.id===pid);
    return { name: p ? p.name : '(منتج محذوف)', qty };
  }).sort((a,b)=>b.qty-a.qty);
  const topSellers = soldEntries.slice(0,5);
  const neverSold = db.products.filter(p=>!qtyByProduct[p.id]);
  const slowMovers = [...soldEntries].sort((a,b)=>a.qty-b.qty).slice(0,5);

  // period breakdown
  const now = new Date();
  function inPeriod(dateStr, period){
    const d = new Date(dateStr);
    if(period==='day') return d.toDateString()===now.toDateString();
    if(period==='week'){ const diff = (now - d)/(1000*60*60*24); return diff>=0 && diff<7; }
    if(period==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    if(period==='year') return d.getFullYear()===now.getFullYear();
    return false;
  }
  const periodSales = validSales.filter(s=>inPeriod(s.date, analyticsPeriod));
  const periodRevenue = periodSales.reduce((s,x)=>s+x.price*x.qty,0);
  const periodProfit = periodSales.reduce((s,x)=>s+x.profit,0);
  const periodLabel = { day:'اليوم', week:'آخر ٧ أيام', month:'هذا الشهر', year:'هذي السنة' }[analyticsPeriod];

  document.getElementById('analyticsBody').innerHTML = `
    <div class="analytics-section">
      <h4>الأكثر مبيعاً</h4>
      ${topSellers.length===0? `<div class="empty" style="padding:16px;">لا توجد بيانات بعد</div>` :
        topSellers.map(x=>`<div class="analytics-row"><span class="n">${x.name}</span><span class="mono">${x.qty} قطعة</span></div>`).join('')}
    </div>
    <div class="analytics-section">
      <h4>الأكثر ركوداً</h4>
      ${neverSold.length>0 ?
        neverSold.slice(0,5).map(p=>`<div class="analytics-row"><span class="n">${p.name}</span><span class="mono" style="color:var(--muted)">ما انباع أبداً</span></div>`).join('')
        : (slowMovers.length===0? `<div class="empty" style="padding:16px;">لا توجد بيانات بعد</div>` :
        slowMovers.map(x=>`<div class="analytics-row"><span class="n">${x.name}</span><span class="mono">${x.qty} قطعة</span></div>`).join(''))}
    </div>
    <div class="analytics-section">
      <h4>الأداء حسب الفترة</h4>
      <div class="periodtabs">
        <button class="periodtab ${analyticsPeriod==='day'?'active':''}" onclick="setAnalyticsPeriod('day')">اليوم</button>
        <button class="periodtab ${analyticsPeriod==='week'?'active':''}" onclick="setAnalyticsPeriod('week')">أسبوع</button>
        <button class="periodtab ${analyticsPeriod==='month'?'active':''}" onclick="setAnalyticsPeriod('month')">شهر</button>
        <button class="periodtab ${analyticsPeriod==='year'?'active':''}" onclick="setAnalyticsPeriod('year')">سنة</button>
      </div>
      <div class="analytics-row"><span class="n">${periodLabel} — عدد العمليات</span><span class="mono">${periodSales.length}</span></div>
      <div class="analytics-row"><span class="n">المبيعات</span><span class="mono">${fmt(periodRevenue)} د.ع</span></div>
      <div class="analytics-row"><span class="n">الربح الصافي</span><span class="mono" style="color:var(--green)">${fmt(periodProfit)} د.ع</span></div>
    </div>
  `;
}

/* ---------- inventory root dispatcher ---------- */
function renderInventory(){
  const q = (document.getElementById('searchInput').value||'').trim().toLowerCase();
  const root = document.getElementById('inventoryRoot');
  if(q){
    const list = db.products.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.code||'').toLowerCase().includes(q) ||
      (p.brand||'').toLowerCase().includes(q) ||
      (p.model||'').toLowerCase().includes(q)
    );
    root.innerHTML = `<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">نتائج البحث (كل الصناديق)</div>` + productListHTML(list);
    return;
  }
  if(viewingUncategorized){
    renderUncategorized(root);
  }else if(navPath.length===0){
    renderCategoryGrid(root);
  }else{
    renderCategoryDetail(root);
  }
}

function renderCategoryGrid(root){
  const topCats = db.categories.filter(c=>!c.parentId);
  const uncategorized = db.products.filter(p=>!p.categoryId).length;
  let html = `<div class="catgrid">`;
  topCats.forEach(c=>{
    html += categoryTileHTML(c);
  });
  if(uncategorized>0){
    const uncatLow = db.products.some(p=>!p.categoryId && isLow(p));
    html += `
      <div class="catcard" onclick="openUncategorized()">
        <div class="icon glass">${uncatLow?'<div class="lowdot"></div>':''}📦</div>
        <div class="name">بدون تصنيف</div>
        <div class="count">${uncategorized} منتج</div>
      </div>`;
  }
  html += `
      <div class="catcard addnew" onclick="openCategoryModal(null,null)">
        <div class="icon">＋</div>
        <div class="name">صندوق جديد</div>
      </div>
    </div>`;
  root.innerHTML = html;
  if(topCats.length===0 && uncategorized===0){
    root.innerHTML = `<div class="empty">أنشئ أول صندوق منتجات (مثل: ريموت إنذار، فرشات، عطور...) ثم أضف إليه أنواعه أو فئاته الفرعية</div>` + root.innerHTML;
  }
}

function categoryTileHTML(c){
  const subcats = db.categories.filter(x=>x.parentId===c.id);
  const directCount = db.products.filter(p=>p.categoryId===c.id).length;
  const countLabel = subcats.length>0 ? `${subcats.length} فئة` : `${directCount} منتج`;
  const low = categoryHasLowStockDeep(c.id);
  return `
    <div class="catcard" onclick="openCategory('${c.id}')">
      <div class="icon glass">
        ${low?'<div class="lowdot"></div>':''}
        <button class="edit" onclick="event.stopPropagation();openCategoryModal('${c.id}')">✎</button>
        ${categoryIconHTML(c)}
      </div>
      <div class="name">${c.name}</div>
      <div class="count">${countLabel}</div>
    </div>`;
}

function categoryIconHTML(c){
  if(c.icon && c.icon.type==='image') return `<img src="${c.icon.value}">`;
  return `<span>${c.icon?.value || '📦'}</span>`;
}

function renderCategoryDetail(root){
  const currentId = navPath[navPath.length-1];

  if(!cat){ navPath=[]; renderInventory(); return; }
  const subcats = db.categories.filter(c=>c.parentId===currentId);
  const directProducts = db.products.filter(p=>p.categoryId===currentId);

  let html = `
    <div class="backbar">
      <button class="glass" onclick="backOneLevel()">‹ رجوع</button>

  if(subcats.length>0){
    html += `<div class="catgrid">`;
    subcats.forEach(c=>{ html += categoryTileHTML(c); });
    html += `
      <div class="catcard addnew" onclick="openCategoryModal(null,'${currentId}')">
        <div class="icon">＋</div>
        <div class="name">فئة فرعية</div>

    html += `<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:10px;" onclick="openCategoryModal(null,'${currentId}')">＋ إضافة فئة فرعية (مثلاً: شركة سيارة)</button>`;
  }

  html += `<div class="sectionlabel">المنتجات المباشرة بهذا الصندوق</div>`;
  html += `<button class="btn btn-amber" style="margin-bottom:12px;" onclick="openProductModal(null, '${currentId}')">＋ نوع/موديل جديد هنا</button>`;
  html += productListHTML(directProducts);

  root.innerHTML = html;
}

/* ---------- product list + gauge ---------- */
function gaugeSVG(pct, danger){
  const c = Math.max(0, Math.min(1, pct));
  const angle = -90 + c*180;
  const x2 = 20 + 14*Math.cos(angle*Math.PI/180);
  const y2 = 22 + 14*Math.sin(angle*Math.PI/180);
  const color = danger ? 'var(--red)' : 'var(--green)';
  return `<svg width="38" height="22" viewBox="0 0 40 24">
    <path d="M4 22 A18 18 0 0 1 36 22" fill="none" stroke="var(--border)" stroke-width="4" stroke-linecap="round"/>
    <path d="M4 22 A18 18 0 0 1 36 22" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${c*56.5} 100"/>
    <line x1="20" y1="22" x2="${x2}" y2="${y2}" stroke="var(--amber)" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

function productListHTML(list){
  if(list.length===0){
    return `<div class="empty">لا توجد منتجات هنا بعد</div>`;
  }
  return list.map(p=>{
    const danger = isLow(p);
    const pct = p.qty<=0 ? 0 : Math.min(1, p.qty/Math.max((p.minStock??3)*3,6));
    const qv = qtyDraft[p.id] ?? 1;
    const hasUndo = db.sales.some(s=>s.productId===p.id && !s.returned);
    return `
    <div class="card glass">
      <div class="prow">
        <div class="gauge">${gaugeSVG(pct,danger)}</div>
        <div class="info">
          <div class="name">
            ${p.brandLogo?`<img class="brandlogo" src="${p.brandLogo}">`:''}
            ${p.name} ${p.code?`<span class="codebadge">${p.code}</span>`:''}
            ${danger?'<span style="color:var(--red)">⚠</span>':''}
          </div>
          <div class="meta">
            ${p.brand?`<span>${p.brand}</span>`:''}
            ${p.model?`<span>· ${p.model}</span>`:''}
            <span>· الكمية: ${p.qty}</span>
            <span>· كلفة ${fmt(p.cost)}</span>
            <span>· بيع ${fmt(p.price)}</span>
          </div>
        </div>
      </div>
      <div class="actionrow">
        <div class="stepper">
          <button onclick="stepQty('${p.id}',-1)">−</button>
          <span id="qty-${p.id}">${qv}</span>
          <button onclick="stepQty('${p.id}',1)">＋</button>
        </div>
        <button class="btn btn-green" ${p.qty<=0?'disabled':''} onclick="sellProduct('${p.id}')" style="flex:1;justify-content:center;">بيع</button>
        <button class="btn btn-red" ${hasUndo?'':'disabled'} onclick="undoLastSale('${p.id}')" style="flex:1;justify-content:center;">تراجع</button>
        <div class="pillbtns">
          <button class="iconbtn" onclick="openProductModal('${p.id}')">✎</button>
          <button class="iconbtn" style="color:var(--red)" onclick="deleteProduct('${p.id}')">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function stepQty(id, delta){
  const cur = qtyDraft[id] ?? 1;
  qtyDraft[id] = Math.max(1, cur+delta);
  const el = document.getElementById('qty-'+id);
  if(el) el.textContent = qtyDraft[id];
}

function sellProduct(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  const qty = qtyDraft[id] ?? 1;
  if(qty > p.qty){ toast(`الكمية المتوفرة فقط ${p.qty}`, 'err'); return; }
  p.qty -= qty;
  db.sales.unshift({
    id: uid(), productId: p.id, name: p.name, qty,
    cost: p.cost, price: p.price, profit: (p.price-p.cost)*qty,
    date: new Date().toISOString(), returned:false
  });
  qtyDraft[id] = 1;
  saveDB();
  renderStats(); renderInventory();
  toast(`بيع: ${p.name} × ${qty}`);
}

function undoLastSale(productId){
  const s = db.sales.find(x=>x.productId===productId && !x.returned);
  if(!s){ toast('لا توجد عملية بيع حديثة لهذا المنتج للتراجع عنها','err'); return; }
  processReturn(s.id);
}

function processReturn(saleId){
  const s = db.sales.find(x=>x.id===saleId);
  if(!s || s.returned) return;
  const p = db.products.find(x=>x.id===s.productId);
  if(p){ p.qty += s.qty; }
  s.returned = true;
  saveDB();
  renderStats(); renderInventory(); renderSales();
  toast(`تم إرجاع: ${s.name} × ${s.qty}`);
}

function returnSale(id){
  const s = db.sales.find(x=>x.id===id);
  if(!s || s.returned) return;
  showConfirm(`تأكيد إرجاع: ${s.name} × ${s.qty}؟ ستعود الكمية إلى المخزون، ويُحذف الربح من الحساب.`, ()=>{
    processReturn(id);
  });
}

function deleteProduct(id){
  showConfirm('تأكيد حذف المنتج؟', ()=>{
    db.products = db.products.filter(p=>p.id!==id);
    saveDB(); renderStats(); renderInventory();
    toast('تم حذف المنتج');
  });
}

function cancelPurchase(id){
  const r = db.purchases.find(x=>x.id===id);
  if(!r) return;
  showConfirm('تأكيد إلغاء وصل الشراء؟ ستُطرح الكمية التي أضافها من المخزون.', ()=>{
    r.items.forEach(it=>{
      if(!it.productId) return;
      const p = db.products.find(x=>x.id===it.productId);
      if(p) p.qty = Math.max(0, p.qty - it.qty);
    });
    db.purchases = db.purchases.filter(x=>x.id!==id);
    saveDB(); renderStats(); renderPurchases();
    toast('تم إلغاء وصل الشراء');
  });
}

/* ---------- standalone print (works around iOS blocking print() inside home-screen apps) ---------- */
const PRINT_PAGE_STYLE = `
  @page{ size:A4; margin:10mm; }
  @media print{ body{ margin:0; padding:0; } }
  *{ box-sizing:border-box;
     -webkit-print-color-adjust:exact !important;
     print-color-adjust:exact !important;
     color-adjust:exact !important;
  }
  html, body{ width:100%; }
  body{ margin:0; padding:0; background:#fff; color:#111; font-family:-apple-system,Arial,sans-serif; direction:rtl; }
  .invoice-paper{ width:100%; }
  .invoice-paper img{ max-width:100%; }
  /* iOS AirPrint renders HTML pages using the phone's narrow screen viewport
     width even inside @media print, ignoring @page width, which is what makes
     a receipt sized with width:100% (a %-based, viewport-relative unit) look
     tiny and centered on the A4 sheet. Millimetres are an absolute physical
     unit tied to @page instead of the viewport, so forcing the paper to an
     explicit mm width here sidesteps that iOS bug with zero extra JS or
     network dependency — works identically online and offline. */
  @media print{
    html, body{ width:190mm !important; }
    .invoice-paper{ width:190mm !important; max-width:190mm !important; page-break-inside:avoid; }
  }

  .invoice-paper .inv-logo-wrap{ text-align:center; margin-bottom:16px; }
  .invoice-paper .inv-logo-wrap img{ width:150px; height:auto; object-fit:contain; }

  .invoice-paper table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .invoice-paper thead th{ background:#E2860F; color:#fff; font-size:14.5px; padding:12px 8px; text-align:center; font-weight:800; }
  .invoice-paper thead th:nth-child(1){ width:7%; }

    font-size:16.5px; padding:12px 16px; justify-content:space-between; margin-top:4px; }
  .invoice-paper .inv-paid-row{ display:flex; justify-content:space-between; padding:10px 16px; font-size:15px; font-weight:700; border-bottom:1px solid #eee; }
  .invoice-paper .inv-paid-row .lbl-paid{ color:#1F9D63; }
  .invoice-paper .inv-paid-row .lbl-due{ color:#E24438; }

  .invoice-paper .inv-notes{ margin-top:22px; font-size:14px; }
  .invoice-paper .inv-notes > b{ display:block; margin-bottom:8px; font-size:14.5px; }
  .invoice-paper .inv-notes ul{ margin:0; padding-inline-start:20px; }

  .invoice-paper .inv-approve{ margin-top:26px; font-size:14.5px; }
  .invoice-paper .inv-thanks{ text-align:center; font-size:22px; font-weight:800; margin-top:22px; }
  .invoice-paper .inv-qr-wrap{ text-align:center; margin-top:16px; }
  .invoice-paper .inv-qr-wrap img{ width:105px; height:105px; background:#fff; padding:4px;
    image-rendering:-webkit-optimize-contrast; image-rendering:crisp-edges; }
  .invoice-paper .inv-footer{ text-align:center; margin-top:16px; padding-top:14px; border-top:1px solid #eee;

  .printbar .hint{ width:100%; font-size:11.5px; color:#999; margin-top:4px; }
  @media print{ .printbar{ display:none; } }
`;
function openPrintableDocument(bodyHtml){
  const doc = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصل</title>
    <style>${PRINT_PAGE_STYLE}</style>
    </head><body>
    <div class="printbar">
      <button id="pdfBtn" onclick="downloadAsPDF()" disabled>⬇️ جارِ تجهيز الوصل...</button>
      <div class="hint">بعد ما يفتح الوصل بصيغة PDF، اضغط أيقونة المشاركة 📤 بالأسفل للطباعة أو الإرسال</div>
    </div>
    ${bodyHtml}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
    <script>
      // Belt-and-suspenders fix for the same iOS AirPrint viewport bug:
      // widen the layout viewport only during the print moment itself, then
      // restore it right after. Pure vanilla JS, no network dependency —
      // works exactly the same online or fully offline.
      var __vpMeta = document.querySelector('meta[name="viewport"]');
      var __vpOriginal = __vpMeta ? __vpMeta.getAttribute('content') : null;
      window.addEventListener('beforeprint', function(){
        if (__vpMeta) __vpMeta.setAttribute('content', 'width=1000');
      });
      window.addEventListener('afterprint', function(){
        if (__vpMeta && __vpOriginal) __vpMeta.setAttribute('content', __vpOriginal);
      });
      var pdfLibsReady = false;
      (function waitLibs(){
        if (window.html2canvas && window.jspdf) {
          pdfLibsReady = true;
          var btn = document.getElementById('pdfBtn');
          if (btn) { btn.disabled = false; btn.textContent = '👁 فتح / طباعة الوصل'; }
        } else if (!pdfLibsReady) {
          setTimeout(waitLibs, 300);
        }
      })();
      setTimeout(function(){
        if (!pdfLibsReady) {
          var btn = document.getElementById('pdfBtn');
          if (btn) { btn.textContent = '🖨 طباعة (بدون نت)'; btn.disabled = false; btn.onclick = function(){ window.print(); }; }
        }
      }, 8000);
      async function downloadAsPDF(){
        var btn = document.getElementById('pdfBtn');
        var original = btn.textContent;
        btn.disabled = true; btn.textContent = '⏳ يشتغل عليه...';
        try{
          var el = document.querySelector('.invoice-paper');
          // Force the capture to lay out at an A4-proportioned width (794px ≈
          // 210mm at 96dpi) instead of the phone's narrow screen width.
          // Without this, html2canvas captures the receipt at ~390px wide
          // (tall/narrow, phone-shaped), and placing that skinny image onto
          // an A4 page while keeping its aspect ratio is exactly what was
          // shrinking it into a narrow column with big empty side margins —
          // that was the real bug, not a printing/viewport quirk.
          var A4_PX = 794;
          var canvas = await html2canvas(el, {
            scale:2, backgroundColor:'#ffffff', useCORS:true,
            windowWidth: A4_PX
          });
          var imgData = canvas.toDataURL('image/png');
          var jsPDF = window.jspdf.jsPDF;
          var pdf = new jsPDF('p','mm','a4');
          var pageW = 210, pageH = 297, margin = 10;
          var usableW = pageW - margin*2, usableH = pageH - margin*2;
          var imgW = usableW;
          var imgH = canvas.height * imgW / canvas.width;
          if (imgH > usableH) { imgH = usableH; imgW = canvas.width * imgH / canvas.height; }
          var x = (pageW - imgW) / 2;
          pdf.addImage(imgData, 'PNG', x, margin, imgW, imgH);
          var blob = pdf.output('blob');
          var url = URL.createObjectURL(blob);
          var win = window.open(url, '_blank');
          if (!win) {
            var a = document.createElement('a');
            a.href = url; a.download = 'وصل.pdf';
            document.body.appendChild(a); a.click(); a.remove();
          }
        } catch(err){
          alert('تعذر تجهيز الوصل، جرب مرة ثانية أو استخدم زر الطباعة العادية');
        }
        btn.disabled = false; btn.textContent = original;
      }
    <\/script>
    </body></html>`;
  const blob = new Blob([doc], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
let invoiceCart = [];
let invoicePickerCategory = null;
let editingInvoiceId = null;
function openInvoiceModal(){
  editingInvoiceId = null;
  invoiceCart = [];
  invoicePickerCategory = null;
  renderInvoiceModalShell({
    title: 'وصل بيع جديد', btnLabel:'تم — تسجيل وطباعة',
    custname:'', custphone:'', paid:'', due:'', notes:''
  });
}
function openEditInvoiceModal(invoiceId){
  const inv = db.invoices.find(x=>x.id===invoiceId);
  if(!inv) return;
  editingInvoiceId = invoiceId;
  invoicePickerCategory = null;
  // "available" per line = current stock of that product + what THIS invoice already
  // reserved for it, since those reserved units are free to reshuffle within the edit
  invoiceCart = inv.items.map(it=>{
    const p = it.productId ? db.products.find(x=>x.id===it.productId) : null;
    return { productId: it.productId||null, name: it.name, qty: it.qty, price: it.price, cost: it.cost, available: (p?p.qty:0) + it.qty };
  });
  renderInvoiceModalShell({
    title: 'تعديل وصل بيع #' + (inv.invoiceNumber?String(inv.invoiceNumber).padStart(4,'0'):'----'),
    btnLabel: '💾 حفظ التعديلات',
    custname: inv.customerName||'', custphone: inv.customerPhone||'',
    paid: inv.paid ?? '', due: inv.due ?? '', notes: (inv.notes||[]).join('\n')
  });
}
function renderInvoiceModalShell(opts){
  const esc = s => String(s==null?'':s).replace(/"/g,'&quot;');
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="closeModal(event)">

function addToInvoiceCart(productId){
  if(!productId) return;
  const p = db.products.find(x=>x.id===productId);
  if(!p) return;
  const existing = invoiceCart.find(c=>c.productId===productId);
  if(existing){
    if(existing.qty+1 > existing.available){ toast(`الكمية المتوفرة فقط ${existing.available}`,'err'); return; }
    existing.qty += 1;
  }
  else{ invoiceCart.push({ productId: p.id, name: p.name, qty: 1, price: p.price, cost: p.cost, available: p.qty }); }
  renderInvoiceCart();
  toast(`تمت الإضافة: ${p.name}`);
}
function updateCartQty(i, delta){
  const item = invoiceCart[i];
  const next = item.qty + delta;
  if(next < 1) return;
  if(next > item.available){ toast(`الكمية المتوفرة فقط ${item.available}`,'err'); return; }
  item.qty = next;
  renderInvoiceCart();
}
function removeCartItem(i){ invoiceCart.splice(i,1); renderInvoiceCart(); }
function renderInvoiceCart(){
  const root = document.getElementById('invoiceCartRoot');
  if(!root) return;
  root.innerHTML = invoiceCart.map((c,i)=>`
    <div class="cartrow">
      <div class="nm">${c.name}</div>
      <div class="qtybox">
        <button onclick="updateCartQty(${i},-1)">−</button>
        <span class="mono">${c.qty}</span>
        <button onclick="updateCartQty(${i},1)">＋</button>
      </div>
      <div class="price mono">${fmt(c.price*c.qty)}</div>
      <button class="iconbtn" style="color:var(--red)" onclick="removeCartItem(${i})">✕</button>
    </div>
  `).join('') || `<div class="empty" style="padding:14px;">أضف منتجات من القائمة أعلاه</div>`;
  const total = invoiceCart.reduce((s,c)=>s+c.price*c.qty,0);
  const totalEl = document.getElementById('invoiceTotalVal');
  if(totalEl) totalEl.textContent = fmt(total) + ' د.ع';
  updateInvoiceDue();
}
/* الباقي = المجموع − المبلغ المستلم، محسوب تلقائياً في كل مرة يتغير فيها المبلغ المستلم أو محتوى الوصل */
function updateInvoiceDue(){
  const dueEl = document.getElementById('f_due');
  if(!dueEl) return;
  const total = invoiceCart.reduce((s,c)=>s+c.price*c.qty,0);
  const paidEl = document.getElementById('f_paid');
  const paidRaw = paidEl ? paidEl.value.trim() : '';
  const paid = paidRaw === '' ? 0 : Number(paidRaw);
  const due = Math.max(0, total - (isNaN(paid) ? 0 : paid));
  dueEl.value = due ? Math.round(due*100)/100 : 0;
}
function finalizeInvoice(){
  if(invoiceCart.length===0){ toast('أضف منتجاً واحداً على الأقل للوصل','err'); return; }
  const customerName = document.getElementById('f_custname').value.trim() || 'زبون';
  const customerPhone = document.getElementById('f_custphone').value.trim();
  // validate stock
  for(const c of invoiceCart){
    const p = db.products.find(x=>x.id===c.productId);
    if(!p || c.qty > p.qty){ toast(`الكمية غير كافية لـ ${c.name}`,'err'); return; }
  }
  const date = new Date().toISOString();
  const items = invoiceCart.map(c=>({ productId:c.productId||null, name:c.name, qty:c.qty, price:c.price, cost:c.cost, subtotal:c.price*c.qty }));
  const total = items.reduce((s,i)=>s+i.subtotal,0);
  // apply stock + sales log (track sale ids so the invoice can be cleanly deleted later)
  const saleIds = [];
  invoiceCart.forEach(c=>{
    const p = db.products.find(x=>x.id===c.productId);
    p.qty -= c.qty;
    const saleId = uid();
    saleIds.push(saleId);
    db.sales.unshift({
      id: saleId, productId: p.id, name: p.name, qty: c.qty,
      cost: c.cost, price: c.price, profit: (c.price-c.cost)*c.qty,
      date, returned:false
    });
  });
  const invoiceNumber = (db.invoices.length + 1);
  const paidRaw = document.getElementById('f_paid').value.trim();
  const dueRaw = document.getElementById('f_due').value.trim();
  const paid = paidRaw === '' ? 0 : Number(paidRaw);
  const due = dueRaw === '' ? total : Number(dueRaw);
  const notes = document.getElementById('f_notes').value
    .split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3);
  const invoice = { id: uid(), invoiceNumber, customerName, customerPhone, date, items, total, saleIds, paid, due, notes };
  db.invoices.unshift(invoice);
  saveDB();
  closeModal();
  renderStats(); renderInventory(); renderSales(); renderInvoices();
  toast('تم تسجيل الوصل');
  printInvoice(invoice.id);
}
function saveEditedInvoice(){
  if(!editingInvoiceId) return;
  const inv = db.invoices.find(x=>x.id===editingInvoiceId);
  if(!inv) return;
  if(invoiceCart.length===0){ toast('أضف منتجاً واحداً على الأقل للوصل','err'); return; }
  const customerName = document.getElementById('f_custname').value.trim() || 'زبون';
  const customerPhone = document.getElementById('f_custphone').value.trim();
  for(const c of invoiceCart){
    if(c.qty > c.available){ toast(`الكمية غير كافية لـ ${c.name}`,'err'); return; }
  }
  // 1) release stock reserved by the OLD version of this invoice, drop its old sale records
  (inv.saleIds||[]).forEach(saleId=>{
    const sale = db.sales.find(s=>s.id===saleId);
    if(sale && !sale.returned){
      const p = db.products.find(x=>x.id===sale.productId);
      if(p) p.qty += sale.qty;
    }
  });
  const oldSaleIds = new Set(inv.saleIds||[]);
  db.sales = db.sales.filter(s=>!oldSaleIds.has(s.id));
  // 2) apply the NEW cart exactly like a fresh invoice, keeping the original date
  const items = invoiceCart.map(c=>({ productId:c.productId||null, name:c.name, qty:c.qty, price:c.price, cost:c.cost, subtotal:c.price*c.qty }));
  const total = items.reduce((s,i)=>s+i.subtotal,0);
  const saleIds = [];
  invoiceCart.forEach(c=>{
    const p = c.productId ? db.products.find(x=>x.id===c.productId) : null;
    if(p) p.qty -= c.qty;
    const saleId = uid();
    saleIds.push(saleId);
    db.sales.unshift({
      id: saleId, productId: c.productId||null, name: c.name, qty: c.qty,
      cost: c.cost, price: c.price, profit: (c.price-c.cost)*c.qty,
      date: inv.date, returned:false
    });
  });
  const paidRaw = document.getElementById('f_paid').value.trim();
  const dueRaw = document.getElementById('f_due').value.trim();
  const paid = paidRaw === '' ? 0 : Number(paidRaw);
  const due = dueRaw === '' ? total : Number(dueRaw);
  const notes = document.getElementById('f_notes').value
    .split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3);
  inv.customerName = customerName;
  inv.customerPhone = customerPhone;
  inv.items = items;
  inv.total = total;
  inv.saleIds = saleIds;
  inv.paid = paid;
  inv.due = due;
  inv.notes = notes;
  saveDB();
  closeModal();
  editingInvoiceId = null;
  renderStats(); renderInventory(); renderSales(); renderInvoices();
  toast('تم حفظ تعديلات الوصل');
}

function deleteInvoice(invoiceId){
  const inv = db.invoices.find(x=>x.id===invoiceId);
  if(!inv) return;
  showConfirm('تأكيد حذف هذا الوصل بالكامل؟ ستعود الكمية المباعة فيه إلى المخزون، وسيُحذف من سجل المبيعات.', ()=>{
    (inv.saleIds||[]).forEach(saleId=>{
      const sale = db.sales.find(s=>s.id===saleId);
      if(sale && !sale.returned){
        const p = db.products.find(x=>x.id===sale.productId);
        if(p) p.qty += sale.qty;
      }
      db.sales = db.sales.filter(s=>s.id!==saleId);
    });
    db.invoices = db.invoices.filter(x=>x.id!==invoiceId);
    db.settlements = (db.settlements||[]).filter(st=>st.invoiceId!==invoiceId);
    saveDB();
    renderStats(); renderInventory(); renderSales(); renderInvoices();
    toast('تم حذف الوصل بالكامل');

/* ---------- image resize helper (keeps localStorage small) ---------- */
function resizeImageFile(file, maxSize){
  maxSize = maxSize || 300;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h>maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/png', 0.95));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

          <div class="iconpicker">
            <div class="iconpreview" id="catIconPreview">${categoryIconHTML({icon:tempCategoryIcon})}</div>
            <input id="f_catemoji" placeholder="اكتب إيموجي 🧺" value="${tempCategoryIcon.type==='emoji'?tempCategoryIcon.value:''}" style="flex:1;" oninput="setCatEmoji(this.value)">
          </div>
          <label class="filebtn" style="margin-top:8px;">
            رفع صورة (شعار الشركة مثلاً)
            <input type="file" accept="image/*" style="display:none;" onchange="handleCatImage(event)">
          </label>
        </div>
        ${c?`<button class="btn btn-red-ghost" style="width:100%;justify-content:center;margin-bottom:8px;" onclick="deleteCategory('${c.id}')">حذف الصندوق</button>`:''}
        <button class="btn btn-amber" style="width:100%;justify-content:center;padding:13px;" onclick="saveCategory('${c?.id||''}')">حفظ</button>
      </div>
    </div>`;
}
function setCatEmoji(val){
  if(!val) return;
  tempCategoryIcon = { type:'emoji', value: val };
  document.getElementById('catIconPreview').innerHTML = categoryIconHTML({icon:tempCategoryIcon});
}
async function handleCatImage(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeImageFile(file, 320);
    tempCategoryIcon = { type:'image', value: dataUrl };
    document.getElementById('catIconPreview').innerHTML = categoryIconHTML({icon:tempCategoryIcon});
  }catch(err){ toast('حدث خطأ أثناء رفع الصورة','err'); }
}
function saveCategory(id){
  const name = document.getElementById('f_catname').value.trim();
  if(!name){ toast('يجب كتابة اسم الصندوق','err'); return; }
  if(id){
    const c = db.categories.find(x=>x.id===id);
    c.name = name; c.icon = tempCategoryIcon;
  }else{
    db.categories.push({ id: uid(), name, icon: tempCategoryIcon, parentId: tempCategoryParent||null });
  }
  saveDB(); closeModal(); renderInventory();
  toast('تم حفظ الصندوق');
}
function deleteCategory(id){
  showConfirm('حذف الصندوق؟ سترتفع الفئات الفرعية فيه إلى مستوى الصندوق الأب، وستُنقل المنتجات المباشرة إلى "بدون تصنيف".', ()=>{
    const cat = db.categories.find(x=>x.id===id);
    const grandParent = cat ? cat.parentId : null;
    db.categories.forEach(c=>{ if(c.parentId===id) c.parentId = grandParent; });
    db.products.forEach(p=>{ if(p.categoryId===id) p.categoryId=null; });
    db.categories = db.categories.filter(c=>c.id!==id);
    saveDB();
    navPath = grandParent ? [grandParent] : [];
    renderInventory();
    toast('تم حذف الصندوق');
  });
}

/* ---------- product modal ---------- */
function categoryOptionsHTML(selectedId){
  let html = `<option value="">بدون تصنيف</option>`;
  const roots = db.categories.filter(c=>!c.parentId);
  roots.forEach(r=>{
    html += `<option value="${r.id}" ${selectedId===r.id?'selected':''}>${r.name}</option>`;
    db.categories.filter(c=>c.parentId===r.id).forEach(ch=>{
      html += `<option value="${ch.id}" ${selectedId===ch.id?'selected':''}>— ${ch.name}</option>`;
    });
  });
  return html;
}
let tempBrandLogo = null;
function openProductModal(id, presetCategoryId){
  const p = id ? db.products.find(x=>x.id===id) : null;
  const selCat = p ? p.categoryId : (presetCategoryId ?? '');
  tempBrandLogo = p?.brandLogo || null;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="closeModal(event)">
      <div class="modal glass" onclick="event.stopPropagation()">
        <h3>${p?'تعديل نوع/موديل':'نوع/موديل جديد'} <button onclick="closeModal()">✕</button></h3>
        <div class="field"><label>الصندوق</label>
          <select id="f_categoryId">${categoryOptionsHTML(selCat)}</select>
        </div>
        <div class="field"><label>الاسم / النوع</label><input id="f_name" value="${p?.name||''}" placeholder="مثال: اوبترا، C300..."></div>
        <div class="grid2">
          <div class="field"><label>الشركة (اختياري)</label><input id="f_brand" value="${p?.brand||''}" placeholder="مثال: تويوتا"></div>
          <div class="field"><label>الموديل / السنة</label><input id="f_model" value="${p?.model||''}" placeholder="مثال: 2013-2020"></div>
        </div>
        <div class="field"><label>الرمز (يستخدم للبحث السريع)</label><input id="f_code" value="${p?.code||''}" placeholder="مثال: FRD-C300-01"></div>
        <div class="field">
          <label>شعار الشركة (اختياري)</label>
          <div class="iconpicker">
            <div class="iconpreview" id="brandLogoPreview">${tempBrandLogo?`<img src="${tempBrandLogo}">`:'—'}</div>
            <label class="filebtn">رفع شعار
              <input type="file" accept="image/*" style="display:none;" onchange="handleBrandLogo(event)">
            </label>
            ${tempBrandLogo?`<button class="iconbtn" style="color:var(--red)" onclick="clearBrandLogo()">🗑</button>`:''}
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label>الكمية الحالية</label><input id="f_qty" type="number" value="${p?.qty??0}"></div>
          <div class="field"><label>حد التنبيه للنقص</label><input id="f_min" type="number" value="${p?.minStock??3}"></div>
          <div class="field"><label>سعر الكلفة</label><input id="f_cost" type="number" value="${p?.cost??0}"></div>
          <div class="field"><label>سعر البيع</label><input id="f_price" type="number" value="${p?.price??0}"></div>
        </div>
        <button class="btn btn-amber" style="width:100%;justify-content:center;padding:13px;" onclick="saveProduct('${p?.id||''}')">حفظ</button>
      </div>
    </div>`;
}
async function handleBrandLogo(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    tempBrandLogo = await resizeImageFile(file, 200);
    document.getElementById('brandLogoPreview').innerHTML = `<img src="${tempBrandLogo}">`;
  }catch(err){ toast('حدث خطأ أثناء رفع الصورة','err'); }
}
function clearBrandLogo(){
  tempBrandLogo = null;
  document.getElementById('brandLogoPreview').innerHTML = '—';
}
function saveProduct(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('يجب كتابة الاسم أو النوع','err'); return; }
  const categoryId = document.getElementById('f_categoryId').value || null;
  const data = {
    name, categoryId,
    brand: document.getElementById('f_brand').value.trim(),
    model: document.getElementById('f_model').value.trim(),
    code: document.getElementById('f_code').value.trim(),
    brandLogo: tempBrandLogo,
    qty: Number(document.getElementById('f_qty').value)||0,
    minStock: Number(document.getElementById('f_min').value)||0,
    cost: Number(document.getElementById('f_cost').value)||0,
    price: Number(document.getElementById('f_price').value)||0,
  };
  if(id){
    const p = db.products.find(x=>x.id===id);
    Object.assign(p, data);
  }else{
    db.products.unshift({ id: uid(), ...data });
  }
  saveDB(); closeModal(); renderStats(); renderInventory();
  toast('تم الحفظ');
}

/* ---------- purchase modal ---------- */
let purchaseItems = [];
let editingPurchaseId = null;
let purchasePaymentMode = 'full';
let purchasePaidNow = 0;
function openPurchaseModal(){
  editingPurchaseId = null;
  purchaseItems = [{ mode:'existing', productId:'', name:'', categoryId:'', qty:1, cost:0, price:0 }];
  purchasePaymentMode = 'full';
  purchasePaidNow = 0;
  renderPurchaseModal();
}
function openEditPurchaseModal(purchaseId){
  const r = db.purchases.find(x=>x.id===purchaseId);
  if(!r) return;
  editingPurchaseId = purchaseId;
  purchaseItems = r.items.map(it=>
    it.productId
      ? { mode:'existing', productId: it.productId, name: it.name, categoryId:'', qty: it.qty, cost: it.cost, price: 0 }
      : { mode:'fixed', name: it.name, categoryId:'', qty: it.qty, cost: it.cost, price: it.price||0 }
  );
  purchasePaymentMode = (r.due||0) > 0.001 ? 'deferred' : 'full';
  purchasePaidNow = r.paid || 0;
  renderPurchaseModal();
}
function renderPurchaseModal(){
  const r = editingPurchaseId ? db.purchases.find(x=>x.id===editingPurchaseId) : null;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="closeModal(event)">
      <div class="modal glass" onclick="event.stopPropagation()">
        <h3>${editingPurchaseId? 'تعديل وصل شراء #'+(r&&r.purchaseNumber?String(r.purchaseNumber).padStart(4,'0'):'----') : 'وصل شراء جديد'} <button onclick="closeModal()">✕</button></h3>
        <div class="field"><label>اسم المجهز / المصدر (اختياري)</label><input id="f_supplier" placeholder="مثال: سوق الشورجة" value="${r&&r.supplier?r.supplier:''}"></div>
        <div id="purchaseItemsRoot"></div>
        <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:10px;" onclick="addPurchaseRow()">＋ إضافة صنف ثاني</button>
        <div id="purchasePaymentRoot"></div>
        <button class="btn btn-amber" style="width:100%;justify-content:center;padding:13px;margin-top:10px;" onclick="${editingPurchaseId?'saveEditedPurchase()':'submitPurchase()'}">${editingPurchaseId?'💾 حفظ التعديلات':'تسجيل الوصل'}</button>
      </div>
    </div>`;
  renderPurchaseItems();
  renderPurchasePaymentSection();
}
/* حالة الدفع: مدفوعة بالكامل أو آجل — يُحسب الآجل المستحق للمورد تلقائياً */
function computePurchaseItemsTotal(){
  return purchaseItems.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.cost)||0), 0);
}
function renderPurchasePaymentSection(){
  const root = document.getElementById('purchasePaymentRoot');
  if(!root) return;
  const total = computePurchaseItemsTotal();
  const dueNow = purchasePaymentMode==='deferred' ? Math.max(0, total - (Number(purchasePaidNow)||0)) : 0;
  root.innerHTML = `
    <div class="sectionlabel">حالة الدفع للمورد</div>
    <div class="modetabs">
      <button class="modetab ${purchasePaymentMode==='full'?'active':''}" onclick="setPurchasePaymentMode('full')">مدفوعة بالكامل</button>
      <button class="modetab ${purchasePaymentMode==='deferred'?'active':''}" onclick="setPurchasePaymentMode('deferred')">آجل (دين على المحل)</button>
    </div>
    ${purchasePaymentMode==='deferred' ? `
      <div class="grid2" style="margin-top:8px;">
        <div><label style="font-size:10px;color:var(--muted)">المبلغ المدفوع الآن (اختياري)</label>
          <input id="f_purchasePaidNow" type="number" inputmode="decimal" value="${purchasePaidNow||0}" oninput="onPurchasePaidNowChange(this.value)"></div>
        <div><label style="font-size:10px;color:var(--muted)">الآجل المستحق للمورد</label>
          <input value="${fmt(dueNow)}" disabled style="color:var(--red);font-weight:800;"></div>
      </div>` : ''}
  `;
}
function onPurchasePaidNowChange(v){ purchasePaidNow = Number(v)||0; renderPurchasePaymentSection(); }
function setPurchasePaymentMode(mode){
  purchasePaymentMode = mode;
  if(mode==='full') purchasePaidNow = 0;
  renderPurchasePaymentSection();
}
function renderPurchaseItems(){
  const root = document.getElementById('purchaseItemsRoot');
  root.innerHTML = purchaseItems.map((it,i)=>{
    if(it.mode==='fixed'){
      return `
      <div class="purchase-item glass">
        <div class="top">
          <div style="font-size:11.5px;font-weight:800;color:var(--muted);">منتج جديد (تسجل وقت الشراء) — غير قابل للتعديل هنا</div>
        </div>
        <div style="font-size:13px;font-weight:700;">${it.name}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">الكمية ${it.qty} × كلفة ${fmt(it.cost)}</div>
      </div>`;
    }
    return `
    <div class="purchase-item glass">
      <div class="top">
        <div class="modetabs">
          <button class="modetab ${it.mode==='existing'?'active':''}" onclick="setItemMode(${i},'existing')">منتج موجود</button>
          ${editingPurchaseId?'':`<button class="modetab ${it.mode==='new'?'active':''}" onclick="setItemMode(${i},'new')">منتج جديد</button>`}
        </div>
        ${purchaseItems.length>1?`<button class="iconbtn" style="color:var(--red)" onclick="removePurchaseRow(${i})">✕</button>`:''}
      </div>
      ${it.mode==='existing' ? `
        <select onchange="setItemProduct(${i}, this.value)">
          <option value="">اختر منتج...</option>
          ${db.products.map(p=>`<option value="${p.id}" ${it.productId===p.id?'selected':''}>${p.name}${p.code?' ('+p.code+')':''}</option>`).join('')}
        </select>
      ` : `
        <input placeholder="اسم المنتج" value="${it.name}" oninput="updatePurchaseItem(${i},'name',this.value)" style="margin-bottom:6px;">
        <select onchange="updatePurchaseItem(${i},'categoryId',this.value)">${categoryOptionsHTML(it.categoryId)}</select>
      `}
      <div class="grid3" style="margin-top:8px;">
        <div><label style="font-size:10px;color:var(--muted)">الكمية</label><input type="number" value="${it.qty}" oninput="updatePurchaseItem(${i},'qty',this.value)"></div>
        <div><label style="font-size:10px;color:var(--muted)">كلفة الوحدة</label><input type="number" value="${it.cost}" oninput="updatePurchaseItem(${i},'cost',this.value)"></div>
        ${it.mode==='new'?`<div><label style="font-size:10px;color:var(--muted)">سعر البيع</label><input type="number" value="${it.price}" oninput="updatePurchaseItem(${i},'price',this.value)"></div>`:''}
      </div>
    </div>`;
  }).join('');
}
function setItemMode(i, mode){ purchaseItems[i].mode = mode; renderPurchaseItems(); renderPurchasePaymentSection(); }
function setItemProduct(i, id){
  const prod = db.products.find(p=>p.id===id);
  purchaseItems[i].productId = id;
  purchaseItems[i].cost = prod?.cost ?? 0;
  renderPurchaseItems();
  renderPurchasePaymentSection();
}
function updatePurchaseItem(i, key, val){ purchaseItems[i][key] = val; renderPurchasePaymentSection(); }
function addPurchaseRow(){ purchaseItems.push({ mode:'existing', productId:'', name:'', categoryId:'', qty:1, cost:0, price:0 }); renderPurchaseItems(); renderPurchasePaymentSection(); }
function removePurchaseRow(i){ purchaseItems.splice(i,1); renderPurchaseItems(); renderPurchasePaymentSection(); }

function submitPurchase(){
  const supplier = document.getElementById('f_supplier').value.trim();
  const clean = [];
  purchaseItems.forEach(it=>{
    const qty = Number(it.qty)||0;
    if(qty<=0) return;
    if(it.mode==='existing'){
      if(!it.productId) return;
      const prod = db.products.find(p=>p.id===it.productId);
      clean.push({ productId: it.productId, name: prod.name, qty, cost: Number(it.cost)||0 });
    }else{
      if(!it.name.trim()) return;
      clean.push({ name: it.name.trim(), categoryId: it.categoryId||null, qty, cost: Number(it.cost)||0, price: Number(it.price)||0 });
    }
  });
  if(clean.length===0){ toast('أضف صنفاً واحداً على الأقل','err'); return; }
  clean.forEach(item=>{
    if(item.productId){
      const p = db.products.find(x=>x.id===item.productId);
      p.qty += item.qty; p.cost = item.cost;
    }else{
      db.products.unshift({ id: uid(), name:item.name, categoryId:item.categoryId, qty:item.qty, cost:item.cost, price:item.price||item.cost, minStock:3 });
    }
  });
  const total = clean.reduce((s,i)=>s+i.qty*i.cost,0);
  const purchaseNumber = db.purchases.length + 1;
  let paid, due;
  if(purchasePaymentMode==='deferred'){
    paid = Math.min(Math.max(0, Number(purchasePaidNow)||0), total);
    due = Math.max(0, total - paid);
  }else{
    paid = total; due = 0;
  }
  db.purchases.unshift({ id: uid(), purchaseNumber, supplier, items: clean, total, paid, due, date: new Date().toISOString() });
  saveDB(); closeModal(); renderStats(); renderPurchases();
  toast('تم تسجيل وصل الشراء');
}
function saveEditedPurchase(){
  const r = db.purchases.find(x=>x.id===editingPurchaseId);
  if(!r) return;
  const supplier = document.getElementById('f_supplier').value.trim();
  const clean = [];
  purchaseItems.forEach(it=>{
    if(it.mode==='fixed'){ clean.push({ name: it.name, qty: it.qty, cost: it.cost, price: it.price||0 }); return; }
    const qty = Number(it.qty)||0;
    if(qty<=0) return;
    if(it.mode==='new'){
      if(!it.name.trim()) return;
      clean.push({ isNew:true, name: it.name.trim(), categoryId: it.categoryId||null, qty, cost: Number(it.cost)||0, price: Number(it.price)||0 });
      return;
    }
    if(!it.productId) return;
    const prod = db.products.find(p=>p.id===it.productId);
    if(!prod) return;
    clean.push({ productId: it.productId, name: prod.name, qty, cost: Number(it.cost)||0 });
  });
  if(clean.length===0){ toast('أضف صنفاً واحداً على الأقل','err'); return; }
  // revert what the OLD version of this purchase added to stock (fixed/new-product rows never touched here — they keep their original stock as-is)
  r.items.forEach(old=>{
    if(old.productId){
      const p = db.products.find(x=>x.id===old.productId);
      if(p) p.qty = Math.max(0, p.qty - old.qty);
    }
  });
  // apply the NEW version
  clean.forEach(item=>{
    if(item.isNew){
      db.products.unshift({ id: uid(), name:item.name, categoryId:item.categoryId, qty:item.qty, cost:item.cost, price:item.price||item.cost, minStock:3 });
    } else if(item.productId){
      const p = db.products.find(x=>x.id===item.productId);
      if(p){ p.qty += item.qty; p.cost = item.cost; }
    }
  });
  const total = clean.reduce((s,i)=>s+i.qty*i.cost,0);
  let paid, due;
  if(purchasePaymentMode==='deferred'){
    paid = Math.min(Math.max(0, Number(purchasePaidNow)||0), total);
    due = Math.max(0, total - paid);
  }else{
    paid = total; due = 0;
  }
  r.supplier = supplier;
  r.items = clean.map(({isNew, ...rest})=>rest);
  r.total = total;
  r.paid = paid;
  r.due = due;
  saveDB(); closeModal(); editingPurchaseId = null;
  renderStats(); renderPurchases(); renderInventory();
  toast('تم حفظ تعديلات وصل الشراء');
}

function closeModal(e){
  if(e && e.target !== e.currentTarget) return;
  document.getElementById('modalRoot').innerHTML = '';
  editingInvoiceId = null;
  editingPurchaseId = null;
}

/* custom confirm dialog (native confirm() is blocked inside sandboxed previews) */
function showConfirm(message, onYes, onNo){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="handleConfirmCancel()">
      <div class="modal glass" onclick="event.stopPropagation()" style="max-width:360px;">
        <h3 style="margin-bottom:10px;">تأكيد</h3>
        <p style="font-size:14px;color:var(--text);margin:0 0 18px;line-height:1.6;">${message}</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="handleConfirmCancel()">إلغاء</button>
          <button class="btn btn-red" style="flex:1;justify-content:center;" onclick="handleConfirmYes()">تأكيد</button>
        </div>
      </div>
    </div>`;
  window._confirmYes = ()=>{ closeModal(); if(onYes) onYes(); };
  window._confirmNo = ()=>{ closeModal(); if(onNo) onNo(); };
}
function handleConfirmYes(){ if(window._confirmYes) window._confirmYes(); }
function handleConfirmCancel(){ if(window._confirmNo) window._confirmNo(); else closeModal(); }

/* ---------- backup / restore ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `delta-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('تم حفظ النسخة الاحتياطية في مجلد التنزيلات');
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  showConfirm('ستؤدي استعادة النسخة الاحتياطية إلى استبدال جميع البيانات الحالية. هل أنت متأكد؟', ()=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.products || !parsed.sales || !parsed.purchases){ toast('ملف غير صالح','err'); return; }
        if(!parsed.categories) parsed.categories = [];
        if(!parsed.invoices) parsed.invoices = [];
        if(!parsed.settlements) parsed.settlements = [];
        db = parsed;
        navPath = []; viewingUncategorized = false;
        saveDB();
        renderStats(); renderInventory(); renderSales(); renderPurchases(); renderInvoices();
        toast('تمت استعادة النسخة الاحتياطية بنجاح');
      }catch(err){ toast('ملف غير صالح','err'); }
    };
    reader.readAsText(file);
  });
  e.target.value = '';
}

/* ---------- init ---------- */
renderHeader();
renderStats();
renderInventory();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
